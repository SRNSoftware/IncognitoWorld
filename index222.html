<!DOCTYPE html>
<html lang="en">
<head>
<title>SpiHub</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<style>
    body{
        font-family:Montserrat,sans-serif;
        margin:0;
    }
    .navbar{
        background:transparent!important;
        border:0;
        position:absolute;
        width:100%;
        z-index:10;
        letter-spacing:5px;
    }
    .navbar-brand,
    .navbar-nav li a{
        color:white!important;
    }
    .navbar-brand:hover,
    .navbar-nav li a:hover{
        color:#1abc9c!important;
    }
    .hero{
        height:100vh;
        background-image:url("bg_img-1.png");
        background-size:cover;
        background-position:center;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
    }
    .hero h1{
        font-size: 60px;
    }
    .hero p{
        max-width:600px;
        margin:auto;
        font-size: 20px;
    }

    @media (max-width: 600px) {
    .hero h1 {
        font-size: 40px;
    }

    .hero p {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-default">
<div class="container">

<div class="navbar-header">
<button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
<span class="icon-bar"></span>
<span class="icon-bar"></span>
<span class="icon-bar"></span>
</button>

<a class="navbar-brand" href="#">SpiHub</a>
</div>

<div class="collapse navbar-collapse" id="myNavbar">
<ul class="nav navbar-nav navbar-right">
<li><a href="#">HOME</a></li>
<li><a href="#">POST</a></li>
<li><a href="#">CONTACT US</a></li>
<li><a href="#">SIGN IN</a></li>
</ul>
</div>

</div>
</nav>

<!-- Hero Section -->
<div class="hero text-center">
    <div>
        <h1><b>KARMA</b></h1>
        <p>Karma is the law of action and consequence: every action performed with intention bears its appropriate result, shaping the journey of the self.</p>
    </div>
</div>

</body>
</html>
