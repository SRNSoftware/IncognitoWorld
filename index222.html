<!DOCTYPE html>
<html lang="en">
<head>
    <title>SpiHub - Coming Soon</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,700&display=swap" rel="stylesheet">
    <style>
        /* Reset */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            width:100%;
            height:100%;
            font-family:"Raleway",sans-serif;
        }

        body{
            background:url("bg_img-1.png") center center/cover no-repeat;
            color:#fff;
            overflow:hidden;
        }

        /* Background Overlay */
        .overlay{
            position:relative;
            width:100%;
            height:100vh;
            background:rgba(0,0,0,.25);
        }

        /* Logo */
        .logo{
            position:absolute;
            top:30px;
            left:30px;
            font-size:30px;
            font-weight:600;
            letter-spacing:2px;
        }

        /* Center Content */
        .content{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            width:90%;
            max-width:900px;
            text-align:center;
            animation:fadeUp 1s ease;
        }

        .content h1{
            margin-bottom:25px;
            font-size:70px;
            font-weight:700;
            letter-spacing:4px;
        }

        .line{
            width:220px;
            height:2px;
            margin:0 auto 25px;
            background:#bdbdbd;
        }

        .countdown{
            font-size:28px;
            font-weight:400;
        }

        /* Footer */
        .footer{
            position:absolute;
            left:30px;
            bottom:30px;
            font-size:18px;
        }

        .footer a{
            color:#fff;
            text-decoration:none;
            border-bottom:1px solid #fff;
        }

        .footer a:hover{
            opacity:.8;
        }

        /* Animation */
        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translate(-50%,-40%);
            }

            to{
                opacity:1;
                transform:translate(-50%,-50%);
            }
        }

        /* Tablet */
        @media (max-width:768px){
            .logo{
                top:20px;
                left:20px;
                font-size:24px;
            }

            .content h1{
                font-size:42px;
            }

            .countdown{
                font-size:22px;
            }

            .line{
                width:170px;
            }

            .footer{
                left:20px;
                bottom:20px;
                font-size:16px;
            }
        }

        /* Mobile */
        @media (max-width:480px){
            .logo{
                font-size:20px;
            }

            .content h1{
                font-size:30px;
                letter-spacing:2px;
            }

            .countdown{
                font-size:18px;
            }

            .line{
                width:140px;
            }

            .footer{
                font-size:14px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="logo">SpiHub</div>
        <div class="content">
            <h1>SPIRITUAL HUB</h1>
            <div class="line"></div>
            <p class="countdown">35 Days Left</p>
        </div>
        <div class="footer">
            Powered by
            <a href="#">SpiHub</a>
        </div>
    </div>
</body>
</html>
