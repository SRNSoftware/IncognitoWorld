</header>

<section class="feed">

    <!-- Stories -->
    <div class="stories">

        <div class="story">
            <img src="https://i.pravatar.cc/80?img=1">
            <p>You</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/80?img=2">
            <p>Rahul</p>
        </div>

        <div class="story">
            <img src="https://i.pravatar.cc/80?img=3">
            <p>Priya</p>
        </div>
		
    </div>

    <!-- Create Post -->
<div class="create-post">
    <img src="https://i.pravatar.cc/100?img=8" class="user-pic">
    <input type="text" id="postText" placeholder="What's on your mind?">
    <button id="postBtn">Post</button>
</div>

<div id="feed">
<div class="post-container">
    <!-- Post 1-->
    <div class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/100?img=8">
            <div>
                <h3>Soumya Nanda</h3>
                <small>2 minutes ago</small>
            </div>
        </div>
       <img class="post-image" src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=800">
        <div class="actions">
            <button onclick="likePost()">❤️ Like</button>
            <button>💬 Comment</button>
            <button>🔄 Share</button>
        </div>
        <p class="caption">
            Welcome to IncognitoWorld 🚀
            This is my first social media post.
        </p>
    </div>

    <!-- Post 2-->
    <div class="post">

        </div>
        <p class="caption">

</div>
