<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <!-- PAGE HEADER -->
        <header class="page-header">
            <h1>MY PAGE</h1>
            <div class="header-line"></div>
        </header>


        <!-- ================= POST 1 ================= -->

        <article class="post">

            <h2>Latest Post</h2>

            <div class="post-image">
                <img src="images/post1.jpg" alt="Latest Post">
            </div>

            <p class="post-text">
                My new post text...
            </p>

            <time datetime="2026-08-18">
                18 August 2026
            </time>

        </article>


        <!-- ================= POST 2 ================= -->

        <article class="post">

            <h2>Previous Post</h2>

            <div class="post-image">
                <img src="images/post2.jpg" alt="Previous Post">
            </div>

            <p class="post-text">
                Previous post text...
            </p>

            <time datetime="2026-08-17">
                17 August 2026
            </time>

        </article>


        <!-- ================= POST 3 ================= -->

        <article class="post">

            <h2>Older Post</h2>

            <div class="post-image">
                <img src="images/post3.jpg" alt="Older Post">
            </div>

            <p class="post-text">
                Older post text...
            </p>

            <time datetime="2026-08-16">
                16 August 2026
            </time>

        </article>


        <!-- ================= POST 4 ================= -->

        <article class="post">

            <h2>Another Post</h2>

            <div class="post-image">
                <img src="images/post4.jpg" alt="Another Post">
            </div>

            <p class="post-text">
                Another post text...
            </p>

            <time datetime="2026-08-15">
                15 August 2026
            </time>

        </article>

    </main>

</body>
</html>
